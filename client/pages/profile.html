<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="User Profile — Manage personal details, social links, and career goals for job recommendations.">
  <title>User Profile — ResumeAI</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Mount -->
    <div id="sidebar-mount"></div>

    <div class="app-layout__main">
      <header class="app-layout__topbar">
        <div class="d-flex items-center gap-md">
          <span class="text-sm text-secondary">Account /</span>
          <span class="text-sm font-semibold text-primary">User Profile</span>
        </div>
      </header>

      <main class="app-layout__content">
        <div class="container--narrow">
          <div class="mb-2xl">
            <h1 class="text-3xl font-bold mb-xs">Profile Settings</h1>
            <p class="text-secondary">Keep your information up to date so job match recommendations stay accurate.</p>
          </div>

          <div class="card p-2xl mb-3xl">
            <!-- Avatar & Header -->
            <div class="d-flex items-center gap-xl pb-xl mb-xl" style="border-bottom: 1px solid var(--color-border);">
              <div class="sidebar__avatar" id="profile-header-avatar" style="width: 4.5rem; height: 4.5rem; font-size: 1.5rem;">--</div>
              <div>
                <h2 class="text-xl font-bold" id="profile-header-name">Loading Profile...</h2>
                <div class="text-xs text-muted mb-sm" id="profile-header-subtitle">Member</div>
              </div>
            </div>

            <!-- Profile Form -->
            <form id="profile-form">
              <div class="d-grid grid-cols-2 gap-xl">
                <div class="form-group">
                  <label class="form-label" for="profile-name">Full Name</label>
                  <input type="text" id="profile-name" class="form-input" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                  <label class="form-label" for="profile-email">Email Address</label>
                  <input type="email" id="profile-email" class="form-input" disabled>
                  <span class="form-hint">Email cannot be changed directly.</span>
                </div>

                <div class="form-group">
                  <label class="form-label" for="profile-phone">Phone Number</label>
                  <input type="tel" id="profile-phone" class="form-input" placeholder="+91 98765 43210">
                </div>

                <div class="form-group">
                  <label class="form-label" for="profile-location">Location</label>
                  <input type="text" id="profile-location" class="form-input" placeholder="e.g. Bengaluru, India">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="profile-bio">Professional Summary / Bio</label>
                <textarea id="profile-bio" class="form-textarea" rows="3" placeholder="Brief career summary..."></textarea>
              </div>

              <div class="d-grid grid-cols-3 gap-md">
                <div class="form-group">
                  <label class="form-label" for="profile-linkedin">LinkedIn Profile URL</label>
                  <input type="url" id="profile-linkedin" class="form-input" placeholder="https://linkedin.com/in/username">
                </div>
                <div class="form-group">
                  <label class="form-label" for="profile-github">GitHub Profile URL</label>
                  <input type="url" id="profile-github" class="form-input" placeholder="https://github.com/username">
                </div>
                <div class="form-group">
                  <label class="form-label" for="profile-portfolio">Portfolio / Website</label>
                  <input type="url" id="profile-portfolio" class="form-input" placeholder="https://yourwebsite.com">
                </div>
              </div>

              <div class="d-flex justify-end gap-md pt-lg" style="border-top: 1px solid var(--color-border);">
                <button type="reset" class="btn btn--secondary">Reset</button>
                <button type="submit" id="btn-save-profile" class="btn btn--gradient">
                  Save Changes
                </button>
              </div>
            </form>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../js/utils/constants.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/profile.js"></script>
</body>
</html>
