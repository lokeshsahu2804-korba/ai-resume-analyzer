<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a free ResumeAI account to analyze resumes and unlock personalized job matches.">
  <title>Create Account — ResumeAI</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/pages/auth.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Global Header Navigation Mount -->
  <div id="navbar-mount"></div>

  <main class="auth-wrapper">
    <div class="auth-glow"></div>
    
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i data-lucide="user-plus"></i>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Start analyzing resumes and matching jobs in seconds</p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="e.g. Alex Morgan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Minimum 8 characters" required autocomplete="new-password">
          
          <div class="password-strength">
            <div class="password-strength__meter">
              <div class="password-strength__fill password-strength__fill--strong"></div>
            </div>
            <div class="d-flex justify-between text-2xs text-muted mt-2xs">
              <span>Password strength</span>
              <span class="text-success font-semibold">Strong</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-input" placeholder="Repeat your password" required autocomplete="new-password">
        </div>

        <div class="mb-xl">
          <label class="form-checkbox">
            <input type="checkbox" id="terms" required checked>
            <span class="text-xs">I agree to the <a href="#" class="text-accent">Terms of Service</a> &amp; <a href="#" class="text-accent">Privacy Policy</a></span>
          </label>
        </div>

        <a href="dashboard.html" class="btn btn--gradient btn--lg w-full text-center" id="btn-signup">
          Create Account <i data-lucide="arrow-right"></i>
        </a>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" class="text-accent font-semibold">Sign in instead</a>
      </div>
    </div>
  </main>

  <script src="../js/utils/constants.js"></script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
