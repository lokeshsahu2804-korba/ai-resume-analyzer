<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ResumeAI Notification Center — Real-time alerts for application updates, ATS scoring, and interview requests.">
  <title>Notification Center — ResumeAI</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/pages/dashboard.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Mount -->
    <div id="sidebar-mount"></div>

    <!-- Main Content Area -->
    <div class="app-layout__main">
      <header class="app-layout__topbar">
        <div class="d-flex items-center gap-md">
          <span class="text-sm text-secondary">Account /</span>
          <span class="text-sm font-semibold text-primary">Notification Center</span>
        </div>
        <div class="d-flex items-center gap-md">
          <a href="dashboard.html" class="btn btn--outline btn--sm">
            <i data-lucide="layout-dashboard"></i> Dashboard
          </a>
        </div>
      </header>

      <main class="app-layout__content">
        <div class="d-flex justify-between items-center mb-2xl">
          <div>
            <div class="d-flex items-center gap-sm mb-xs">
              <h1 class="text-3xl font-bold">Notifications</h1>
              <span class="badge badge--primary font-bold" id="notif-center-unread-badge">0 Unread</span>
            </div>
            <p class="text-secondary">Stay updated on your resume parsing, ATS evaluations, application stages, and job matches.</p>
          </div>
          <div class="d-flex gap-xs">
            <button class="btn btn--outline btn--sm" id="btn-mark-all-read">
              <i data-lucide="check-check"></i> Mark All as Read
            </button>
            <button class="btn btn--ghost btn--sm text-danger" id="btn-clear-read">
              <i data-lucide="trash-2"></i> Clear Read
            </button>
          </div>
        </div>

        <!-- Filter Tabs -->
        <div class="card p-xs mb-2xl" style="background: rgba(255, 255, 255, 0.02);">
          <div class="d-flex gap-xs flex-wrap">
            <button class="btn btn--ghost btn--sm notif-tab-btn active" data-filter="all">All Alerts</button>
            <button class="btn btn--ghost btn--sm notif-tab-btn" data-filter="unread">Unread Only</button>
            <button class="btn btn--ghost btn--sm notif-tab-btn" data-filter="application">Applications</button>
            <button class="btn btn--ghost btn--sm notif-tab-btn" data-filter="analysis">ATS Analyses</button>
            <button class="btn btn--ghost btn--sm notif-tab-btn" data-filter="resume">Resumes</button>
          </div>
        </div>

        <!-- Notifications List -->
        <div class="d-flex flex-col gap-md mb-2xl" id="notifications-list-container">
          <div class="card p-2xl text-center text-xs text-muted">
            <div class="spinner spinner--md mb-sm" style="margin: 0 auto;"></div>
            Loading your notification stream...
          </div>
        </div>

        <!-- Pagination -->
        <div id="notifications-pagination" class="d-none"></div>

      </main>
    </div>
  </div>

  <!-- Socket.IO Client CDN -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/notifications.js"></script>
</body>
</html>
