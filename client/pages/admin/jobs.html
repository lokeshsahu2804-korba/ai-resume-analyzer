<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ResumeAI Admin — Job Listings Database Management.">
  <title>Manage Jobs — ResumeAI Admin</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/utilities.css">
  <link rel="stylesheet" href="../../css/pages/admin.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Mount (Admin Mode) -->
    <div id="sidebar-mount"></div>

    <div class="app-layout__main">
      <header class="app-layout__topbar">
        <div class="d-flex items-center gap-md">
          <span class="text-sm text-secondary">Admin Portal /</span>
          <span class="text-sm font-semibold text-primary">Job Database Management</span>
        </div>
        <div class="d-flex items-center gap-md">
          <button class="btn btn--gradient btn--sm" data-modal-target="create-job-modal">
            <i data-lucide="plus"></i> Add New Job Listing
          </button>
        </div>
      </header>

      <main class="app-layout__content">
        <div class="d-flex justify-between items-center mb-2xl">
          <div>
            <h1 class="text-3xl font-bold mb-xs">Job Postings Database</h1>
            <p class="text-secondary">Create, inspect, and delete active enterprise tech job opportunities.</p>
          </div>
        </div>

        <!-- Jobs Table -->
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Job Title &amp; Company</th>
                <th>Experience Level</th>
                <th>Location</th>
                <th>Salary Package</th>
                <th>Status</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-jobs-table-body">
              <!-- Dynamically rendered by admin-jobs.js -->
            </tbody>
          </table>
        </div>

        <!-- Create Job Modal Shell -->
        <div class="modal-backdrop" id="create-job-modal" aria-hidden="true">
          <div class="modal" style="max-width: 600px;">
            <div class="modal__header">
              <h3 class="modal__title">Create Job Posting</h3>
              <button class="modal__close" data-modal-close>&times;</button>
            </div>
            <div class="modal__body">
              <form id="create-job-form">
                <div class="form-group">
                  <label class="form-label" for="job-title">Job Title</label>
                  <input type="text" id="job-title" class="form-input" placeholder="e.g. Senior Backend Architect" required>
                </div>
                <div class="d-grid grid-cols-2 gap-md">
                  <div class="form-group">
                    <label class="form-label" for="company-name">Company Name</label>
                    <input type="text" id="company-name" class="form-input" placeholder="e.g. Stripe" required>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="job-location">Location</label>
                    <input type="text" id="job-location" class="form-input" placeholder="e.g. Remote (India)" required>
                  </div>
                </div>
                <div class="d-grid grid-cols-2 gap-md">
                  <div class="form-group">
                    <label class="form-label" for="job-type">Employment Type</label>
                    <select id="job-type" class="form-select">
                      <option value="full-time" selected>Full Time</option>
                      <option value="part-time">Part Time</option>
                      <option value="contract">Contract</option>
                      <option value="internship">Internship</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="job-exp-level">Experience Level</label>
                    <select id="job-exp-level" class="form-select">
                      <option value="entry">Entry Level (0-2 yrs)</option>
                      <option value="mid" selected>Mid Level (2-4 yrs)</option>
                      <option value="senior">Senior Level (5+ yrs)</option>
                      <option value="lead">Lead / Staff</option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="required-skills">Required Skills (Comma separated)</label>
                  <input type="text" id="required-skills" class="form-input" placeholder="Node.js, Express, MongoDB, TypeScript" required>
                </div>
                <div class="d-grid grid-cols-2 gap-md">
                  <div class="form-group">
                    <label class="form-label" for="job-salary-min">Min Salary (INR / yr)</label>
                    <input type="number" id="job-salary-min" class="form-input" placeholder="2500000">
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="job-salary-max">Max Salary (INR / yr)</label>
                    <input type="number" id="job-salary-max" class="form-input" placeholder="4000000">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="job-description">Job Description</label>
                  <textarea id="job-description" class="form-input" rows="3" placeholder="Overview of role, responsibilities, and team scope..."></textarea>
                </div>
              </form>
            </div>
            <div class="modal__footer">
              <button class="btn btn--secondary" data-modal-close>Cancel</button>
              <button class="btn btn--primary" id="btn-save-new-job">Create Job</button>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../../js/utils/constants.js"></script>
  <script type="module" src="../../js/app.js"></script>
  <script type="module" src="../../js/pages/admin-jobs.js"></script>
</body>
</html>
