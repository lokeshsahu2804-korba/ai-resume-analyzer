<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse and search technology jobs across full-stack, backend, frontend, devops, and AI roles.">
  <title>Browse Jobs — ResumeAI</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/pages/jobs.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Mount -->
    <div id="sidebar-mount"></div>

    <div class="app-layout__main">
      <header class="app-layout__topbar">
        <div class="d-flex items-center gap-md">
          <span class="text-sm text-secondary">Jobs /</span>
          <span class="text-sm font-semibold text-primary">Explore Technology Roles</span>
        </div>
        <div class="d-flex items-center gap-md">
          <a href="analysis.html" class="btn btn--outline btn--sm">
            <i data-lucide="bar-chart-2"></i> View Resume Analysis
          </a>
        </div>
      </header>

      <main class="app-layout__content">
        
        <!-- Header & Search Toolbar -->
        <div class="mb-2xl">
          <h1 class="text-3xl font-bold mb-xs">Explore Open Technology Roles</h1>
          <p class="text-secondary" id="jobs-total-count">Discover verified software engineering, AI, DevOps, and cloud job postings.</p>
        </div>

        <!-- Search & Filter Bar -->
        <div class="card p-lg mb-2xl">
          <div class="d-grid grid-cols-4 gap-md items-center">
            <div class="form-group mb-none">
              <input type="text" class="form-input" id="job-search-input" placeholder="Search title, skills, company (e.g. Python, Docker, Stripe)...">
            </div>
            <div class="form-group mb-none">
              <select class="form-select" id="job-exp-filter">
                <option value="">All Experience Levels</option>
                <option value="entry">Entry Level (0-2 yrs)</option>
                <option value="mid">Mid Level (2-4 yrs)</option>
                <option value="senior">Senior Level (5+ yrs)</option>
                <option value="lead">Lead / Staff</option>
              </select>
            </div>
            <div class="form-group mb-none">
              <select class="form-select" id="job-type-filter">
                <option value="">All Job Types</option>
                <option value="full-time">Full Time</option>
                <option value="part-time">Part Time</option>
                <option value="contract">Contract</option>
                <option value="internship">Internship</option>
              </select>
            </div>
            <div class="d-flex gap-sm">
              <button class="btn btn--primary flex-1" id="job-filter-btn"><i data-lucide="filter"></i> Filter</button>
              <button class="btn btn--ghost" id="job-reset-btn" title="Reset Filters"><i data-lucide="rotate-ccw"></i></button>
            </div>
          </div>
        </div>

        <!-- Loading State -->
        <div class="card p-3xl text-center d-none" id="jobs-loading-spinner" style="max-width: 400px; margin: 40px auto;">
          <div class="spinner spinner--lg mb-md" style="margin: 0 auto;"></div>
          <p class="text-secondary text-sm">Searching job opportunities...</p>
        </div>

        <!-- Empty State -->
        <div class="card p-3xl text-center d-none" id="jobs-empty-state" style="max-width: 500px; margin: 40px auto;">
          <div class="d-inline-flex p-xl mb-md" style="background: rgba(99, 102, 241, 0.1); border-radius: 50%; color: var(--color-primary-light);">
            <i data-lucide="search-x" style="width: 32px; height: 32px;"></i>
          </div>
          <h3 class="text-xl font-bold mb-xs">No Matching Job Postings</h3>
          <p class="text-secondary text-sm mb-lg">Try adjusting your search terms or relaxing experience/type filters.</p>
        </div>

        <!-- Job Cards Grid -->
        <div class="d-grid grid-cols-2 gap-xl mb-2xl" id="jobs-grid-container">
          <!-- Dynamically populated by jobs.js -->
        </div>

        <!-- Pagination Controls -->
        <div id="jobs-pagination-wrapper" class="d-none"></div>

      </main>
    </div>
  </div>

  <script src="../js/utils/constants.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/jobs.js"></script>
</body>
</html>
