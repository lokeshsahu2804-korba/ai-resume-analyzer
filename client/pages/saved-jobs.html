<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Saved Jobs — Access and manage your bookmarked job listings.">
  <title>Saved Jobs — ResumeAI</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/pages/jobs.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Mount -->
    <div id="sidebar-mount"></div>

    <div class="app-layout__main">
      <header class="app-layout__topbar">
        <div class="d-flex items-center gap-md">
          <span class="text-sm text-secondary">Jobs /</span>
          <span class="text-sm font-semibold text-primary">Saved Bookmarks</span>
        </div>
        <div class="d-flex items-center gap-md">
          <a href="jobs.html" class="btn btn--outline btn--sm">
            <i data-lucide="compass"></i> Explore All Jobs
          </a>
        </div>
      </header>

      <main class="app-layout__content">
        <div class="mb-2xl">
          <h1 class="text-3xl font-bold mb-xs">Saved Jobs</h1>
          <p class="text-secondary" id="saved-jobs-count">Track job postings you have bookmarked for later application.</p>
        </div>

        <!-- Loading State -->
        <div class="card p-3xl text-center" id="saved-jobs-loading" style="max-width: 400px; margin: 40px auto;">
          <div class="spinner spinner--lg mb-md" style="margin: 0 auto;"></div>
          <p class="text-secondary text-sm">Loading your bookmarked jobs...</p>
        </div>

        <!-- Empty State -->
        <div class="card p-3xl text-center d-none" id="saved-jobs-empty" style="max-width: 500px; margin: 40px auto;">
          <div class="d-inline-flex p-xl mb-md" style="background: rgba(99, 102, 241, 0.1); border-radius: 50%; color: var(--color-primary-light);">
            <i data-lucide="bookmark-x" style="width: 32px; height: 32px;"></i>
          </div>
          <h3 class="text-xl font-bold mb-xs">No Saved Jobs Yet</h3>
          <p class="text-secondary text-sm mb-lg">Browse active job listings and bookmark roles you're interested in.</p>
          <a href="jobs.html" class="btn btn--primary btn--md"><i data-lucide="search"></i> Browse Opportunities</a>
        </div>

        <!-- Saved Jobs Grid -->
        <div class="d-grid grid-cols-2 gap-xl mb-2xl d-none" id="saved-jobs-grid">
          <!-- Populated dynamically -->
        </div>

        <!-- Pagination -->
        <div id="saved-jobs-pagination" class="d-none"></div>

      </main>
    </div>
  </div>

  <script src="../js/utils/constants.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/saved-jobs.js"></script>
</body>
</html>
