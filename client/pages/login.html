<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your ResumeAI account to view your resume ATS scores and matched jobs.">
  <title>Sign In — ResumeAI</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/pages/auth.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Global Header Navigation Mount -->
  <div id="navbar-mount"></div>

  <main class="auth-wrapper">
    <div class="auth-glow"></div>
    
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i data-lucide="lock"></i>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>
      </div>

      <!-- Demo Credentials Banner -->
      <div class="p-md mb-xl" style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: var(--radius-md);">
        <div class="d-flex items-center gap-xs text-xs font-semibold text-accent mb-2xs">
          <i data-lucide="info" style="width:14px; height:14px;"></i> Demo Credentials
        </div>
        <div class="text-xs text-secondary font-mono">user@example.com • admin@example.com</div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email" value="user@example.com">
        </div>

        <div class="form-group">
          <div class="d-flex justify-between items-center mb-xs">
            <label class="form-label mb-xs" for="password">Password</label>
            <a href="#" class="text-xs text-accent">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" value="password123">
        </div>

        <div class="d-flex justify-between items-center mb-xl">
          <label class="form-checkbox">
            <input type="checkbox" id="remember" checked>
            <span>Remember me for 7 days</span>
          </label>
        </div>

        <a href="dashboard.html" class="btn btn--gradient btn--lg w-full text-center" id="btn-login">
          Sign In <i data-lucide="arrow-right"></i>
        </a>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="signup.html" class="text-accent font-semibold">Create an account</a>
      </div>
    </div>
  </main>

  <script src="../js/utils/constants.js"></script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
